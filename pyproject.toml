[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-llamacpp-client"
version = "1.0.0"
description = "A comprehensive ComfyUI custom node that provides complete client functionality for llama-server from llama.cpp"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.7"
authors = [
    {name = "munder-sa", email = "munder.sa@example.com"}
]
keywords = ["comfyui", "llama.cpp", "ai", "ml", "custom-node"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "requests>=2.28.0",
    "pillow>=9.0.0",
    "numpy>=1.21.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "flake8>=6.0.0",
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/munder-sa/comfyui-llamacpp-client"
Repository = "https://github.com/munder-sa/comfyui-llamacpp-client.git"
Issues = "https://github.com/munder-sa/comfyui-llamacpp-client/issues"

[tool.setuptools.packages.find]
include = ["utils*"]

[tool.black]
line-length = 100
target-version = ['py37']

[tool.isort]
profile = "black"
line_length = 100